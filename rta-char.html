const NM=REF.names, EL=REF.el;
const nm=s=>NM[s]||s;
const esc=v=>String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const cn=s=>`<span class="cn el-${EL[s]||'none'}">${esc(nm(s))}</span>`;
const ELC={fire:'#F98A8A',ice:'#7BB6F5',earth:'#6FD99A',light:'#F6CE5C',dark:'#B39AF3'};
const elColor=s=>ELC[EL[s]]||'var(--text)';

function loadPool(){try{return JSON.parse(localStorage.getItem('rta_logs'))||[];}catch(e){return [];}}
function parseGame(r){
  if(!r||!r.Time) return null;
  const p1=(r.Role1List||[]).map(x=>x.StaticID), p2=(r.Role2List||[]).map(x=>x.StaticID);
  const id2={};(r.Role1List||[]).forEach(x=>id2[x._id.$oid]={sid:x.StaticID,s:1});(r.Role2List||[]).forEach(x=>id2[x._id.$oid]={sid:x.StaticID,s:2});
  let ban1='',ban2='';
  for(const b of (r.BanList||[])){const e=b&&id2[b];if(!e)continue;if(e.s===1)ban1=e.sid;else ban2=e.sid;}
  return {p1,p2,win1:r.WinCUID===r.CUID1,ban1,ban2,pre1:r.PreBan1List||[],pre2:r.PreBan2List||[],c1:r.CUID1,c2:r.CUID2,rank1:r.CUID1Rank,rank2:r.CUID2Rank};
}

const POOL=loadPool().map(parseGame).filter(Boolean);
// 玩家場次（判斷主體：≥50）
const gc={}, names={};
for(const g of POOL){for(const c of [g.c1,g.c2])gc[c]=(gc[c]||0)+1;}
for(const r of loadPool()){for(const p of (r.PlayerInfos||[])){const pi=p.PlayerInfo||{};if(pi.CUID!=null)names[pi.CUID]=pi.Name;}}
const mains=Object.keys(gc).map(Number).filter(c=>gc[c]>=50).sort((a,b)=>gc[b]-gc[a]);

let SUBJECTS=new Set(), RANKFILTER=0, FILTER_EL='', PERSP='enemy', CHAR=null;   // PERSP mine=我方選A / enemy=敵方選A（預設敵方）

function comboKeys(arr,k){ // unordered k-combos of array
  const out=[]; const rec=(start,acc)=>{ if(acc.length===k){out.push(acc.slice());return;} for(let i=start;i<arr.length;i++){acc.push(arr[i]);rec(i+1,acc);acc.pop();} }; rec(0,[]); return out;
}

function analyze(A){
  const useAll=SUBJECTS.size===0;
  const scope = useAll?POOL:POOL.filter(g=>SUBJECTS.has(g.c1)||SUBJECTS.has(g.c2));
  const total=scope.length;
  let banned=0,prebanned=0;
  for(const g of scope){ if(g.ban1===A||g.ban2===A)banned++; if(g.pre1.includes(A)||g.pre2.includes(A))prebanned++; }
  const aGames=[];
  for(const g of scope){
    const aOn = g.p1.includes(A)?1:(g.p2.includes(A)?2:0);   // A 在哪一隊
    if(!aOn) continue;
    const mySide = PERSP==='mine' ? aOn : (aOn===1?2:1);      // 我方＝有A那隊(mine) / 沒A那隊(enemy)
    if(!useAll && !SUBJECTS.has(mySide===1?g.c1:g.c2)) continue;
    const oppSide=mySide===1?2:1;
    const oppRank=oppSide===1?g.rank1:g.rank2;
    if(RANKFILTER && !(oppRank>0 && oppRank<=RANKFILTER)) continue;   // 只算對手排名 ≤門檻
    const myBan=mySide===1?g.ban1:g.ban2, oppBan=oppSide===1?g.ban1:g.ban2;
    if(PERSP==='mine' && myBan===A) continue;    // 我方 A 被 ban，沒上場
    if(PERSP==='enemy' && oppBan===A) continue;  // 敵方 A 被我 ban，等於沒對到
    const myField=(mySide===1?g.p1:g.p2).filter(s=>s!==myBan && s!==A);
    const foeField=(oppSide===1?g.p1:g.p2).filter(s=>s!==oppBan && s!==A);
    aGames.push({won: mySide===1?g.win1:!g.win1, myField, foeField});
  }
  return {total,banned,prebanned,aGames};
}

// 由 aGames 對「某集合來源(oppField/myField)」的 k-combo 聚合勝率
function agg(aGames, srcKey, k){
  const tot={},win={},names2={};
  for(const g of aGames){
    const src=[...new Set(g[srcKey])].sort();
    for(const combo of comboKeys(src,k)){
      const key=combo.join('|'); tot[key]=(tot[key]||0)+1; if(g.won)win[key]=(win[key]||0)+1; names2[key]=combo;
    }
  }
  return Object.keys(tot).map(key=>({combo:names2[key],n:tot[key],w:win[key]||0,wr:pct(win[key]||0,tot[key])}));
}

// 全角色總覽：雙方合計的純角色統計（不分敵我、不受上方主體/視角影響）。
// 牌位段用「該側玩家自己的排名」切，問的是「這個分段的人都在用什麼」，不是「打贏誰」。
const OV_BANDS=[['全部',0,9e9],['前300',1,300],['301-1000',301,1000],['1001+',1001,9e9]];
function overallTable(){
  let bandIdx=0,sortKey='n',dir=1,showAll=false,allRows=[],meta='';
  function recalc(){
    const lo=OV_BANDS[bandIdx][1],hi=OV_BANDS[bandIdx][2];
    const pick={},win={},slot={},ban={},pre={},players={}; let sides=0;
    for(const g of POOL){
      [[g.p1,g.ban1,g.win1,g.rank1,g.c1,g.pre1],[g.p2,g.ban2,!g.win1,g.rank2,g.c2,g.pre2]].forEach(([picks,bn,won,rank,cuid,pres])=>{
        if(bandIdx && !(rank>0 && rank>=lo && rank<=hi)) return;   // 全部(idx 0)不篩，其餘要有排名且落在段內
        sides++; players[cuid]=(players[cuid]||0)+1;
        picks.forEach((s,i)=>{ if(s===bn)return; pick[s]=(pick[s]||0)+1; if(won)win[s]=(win[s]||0)+1; slot[s]=slot[s]||[0,0,0,0,0]; if(i<5)slot[s][i]++; });
        if(bn)ban[bn]=(ban[bn]||0)+1;
        for(const s of pres)pre[s]=(pre[s]||0)+1;
      });
    }
    const denom=Math.max(1,sides/2);   // 每場算兩側，換回「場次當量」才跟原本的使用率同義
    allRows=Object.keys(pick).filter(s=>pick[s]>=3).map(s=>({s,n:pick[s],use:pct(pick[s],denom),wr:pct(win[s]||0,pick[s]),slot:slot[s]||[0,0,0,0,0],banP:pct(ban[s]||0,denom),preP:pct(pre[s]||0,denom)}));
    const counts=Object.values(players).sort((a,b)=>b-a);
    meta=`${sides} 筆選角（≈${Math.round(sides/2)} 場當量）、${counts.length} 位玩家；最大單一玩家佔 ${sides?Math.round(counts[0]/sides*100):0}%`;
  }
  const slotPct=r=>`<span class="slot">`+r.slot.map((c,i)=>{const p=pct(c,r.n);return `<i class="${p?'on':''}" title="${i+1}選 ${p}%">${p?p+'<small class="pcs">%</small>':''}</i>`;}).join('')+`</span>`;
  const det=el(`<details style="margin-top:24px" open><summary style="cursor:pointer;color:#93C5FD;font-weight:700;padding:6px 0;font-size:16px">全角色總覽（使用率 / 勝率 / 順位% / 被ban·preban）</summary></details>`);
  const bandBar=el(`<div class="cg" style="margin:8px 0">牌位段 </div>`);
  const bar=el(`<div class="cg" style="margin:8px 0"><button id="tgAll">顯示低使用率(&lt;4%)</button></div>`);
  const note=el(`<div class="muted" style="margin:2px 0 6px"></div>`);
  const wrap=el(`<div class="scroll" style="margin-top:4px"><table class="big"><thead><tr>
    <th>角色</th><th class="num" data-k="n">使用</th><th class="num" data-k="wr">勝率</th>
    <th>順位%（一二三四五）</th><th class="num" data-k="banP">被ban%</th><th class="num" data-k="preP">被preban%</th></tr></thead><tbody></tbody></table></div>`);
  function body(){
    const shown=allRows.filter(r=>showAll||r.use>=4).sort((a,b)=>(b[sortKey]-a[sortKey])*dir);
    note.textContent=meta+(shown.length?'':'（此段樣本不足，沒有角色達到門檻）');
    wrap.querySelector('tbody').innerHTML=shown.map(r=>`<tr><td>${cn(r.s)}</td><td class="num">${r.n}<span class="muted"> (${r.use}%)</span></td><td class="num ${r.wr>=55?'win':r.wr<45?'lose':''}">${r.wr}%</td><td>${slotPct(r)}</td><td class="num">${r.banP}%</td><td class="num">${r.preP}%</td></tr>`).join('');
    wrap.querySelectorAll('th[data-k]').forEach(th=>th.textContent=({n:'使用',wr:'勝率',banP:'被ban%',preP:'被preban%'})[th.dataset.k]+(th.dataset.k===sortKey?(dir>0?' ▾':' ▴'):''));
  }
  OV_BANDS.forEach((b,i)=>{
    const btn=el(`<button class="${i===bandIdx?'active':''}">${b[0]}</button>`);
    btn.onclick=()=>{bandIdx=i;bandBar.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('active',j===i));recalc();body();};
    bandBar.appendChild(btn);
  });
  wrap.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)dir*=-1;else{sortKey=k;dir=1;}body();});
  bar.querySelector('#tgAll').onclick=()=>{showAll=!showAll;bar.querySelector('#tgAll').textContent=showAll?'隱藏低使用率':'顯示低使用率(<4%)';body();};
  recalc(); body();
  det.appendChild(bandBar); det.appendChild(bar); det.appendChild(note); det.appendChild(wrap);
  det.appendChild(el(`<div class="muted" style="margin-top:6px">雙方合計、不分敵我，不受上方主體/視角/排名影響；牌位段依「該側玩家自己的當場排名」切，所以同一場的兩邊可能落在不同段。預設隱藏使用率 &lt;4% 的角色。使用=次數＋占場次當量%、勝率=該角所在隊伍勝率、順位%=各選位佔該角出場比例、被ban 以場次當量為分母、被preban 算的是「這一段的玩家 preban 誰」。<b>看數字前先看上面那行的玩家數與最大單一玩家佔比</b>：高分段樣本常常集中在少數幾個人身上。點欄位標題可排序。</div>`));
  return det;
}

function twoTables(title,sub,rows,minN,baseline,hiCap,loCap){
  rows=rows.filter(r=>r.n>=minN);
  const wrap=el(`<div><h2>${title}${sub?` <small>${sub}</small>`:''}</h2></div>`);
  if(!rows.length){ wrap.appendChild(el(`<div class="empty">樣本不足（門檻 ≥${minN}）</div>`)); return wrap; }
  const mk=(list,cap,cls)=>{
    const body=list.map(r=>{
      const col=r.wr>=baseline?'win':'lose';
      return `<tr><td>${r.combo.map(cn).join(' + ')}</td><td class="num">${r.n}</td><td class="num ${col}">${r.wr}%</td></tr>`;
    }).join('');
    return `<div><div class="tblcap ${cls}">${cap}</div><div class="scroll"><table><thead><tr><th>對象</th><th class="num">共現</th><th class="num">勝率</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  };
  const hi=[...rows].sort((a,b)=>b.wr-a.wr||b.n-a.n).slice(0,12);
  const lo=[...rows].sort((a,b)=>a.wr-b.wr||b.n-a.n).slice(0,12);
  wrap.appendChild(el(`<div class="pair">${mk(hi,hiCap,'hi')}${mk(lo,loCap,'lo')}</div>`));
  return wrap;
}

function render(){
  app.innerHTML='';
  const useAll=SUBJECTS.size===0;
  // 控制列 0：視角（我方選 A / 敵方選 A）
  const ctl0=el(`<div class="ctlrow"></div>`);
  ctl0.appendChild(el(`<span class="muted">視角：</span>`));
  const pG=el(`<div class="cg"></div>`);
  [['mine','我方選這角色'],['enemy','敵方選這角色']].forEach(([v,lbl])=>{const b=el(`<button class="${PERSP===v?'active':''}">${lbl}</button>`);b.onclick=()=>{PERSP=v;render();};pG.appendChild(b);});
  ctl0.appendChild(pG);
  ctl0.appendChild(el(`<span class="muted">（按 <b style="color:#93C5FD">Q</b> 快速切換）</span>`));
  app.appendChild(ctl0);
  // 控制列 1：主體（可複選）
  const ctl=el(`<div class="ctlrow"></div>`);
  ctl.appendChild(el(`<span class="muted">主體(可複選)：</span>`));
  const subG=el(`<div class="cg"></div>`);
  const allB=el(`<button class="${useAll?'active':''}">全部數據</button>`);
  allB.onclick=()=>{SUBJECTS.clear();render();}; subG.appendChild(allB);
  mains.forEach(c=>{const b=el(`<button class="${SUBJECTS.has(c)?'active':''}">${esc(names[c]||('#'+c))} <span class="muted">${gc[c]}</span></button>`);
    b.onclick=()=>{ if(SUBJECTS.has(c))SUBJECTS.delete(c); else SUBJECTS.add(c); render(); }; subG.appendChild(b);});
  ctl.appendChild(subG);
  ctl.appendChild(el(`<span class="muted" style="margin-left:12px">對手排名：</span>`));
  const rkG=el(`<div class="cg"></div>`);
  [[0,'全部'],[1000,'≤1000'],[500,'≤500'],[200,'≤200']].forEach(([v,lbl])=>{const b=el(`<button class="${RANKFILTER===v?'active':''}">${lbl}</button>`);b.onclick=()=>{RANKFILTER=v;render();};rkG.appendChild(b);});
  ctl.appendChild(rkG);
  app.appendChild(ctl);   // 主體＋對手排名 同一行（設定後不常改）
  // 控制列 3：屬性篩選 + 角色（依出場多→少；選單上色）
  const ctl3=el(`<div class="ctlrow"></div>`);
  const scope=useAll?POOL:POOL.filter(g=>SUBJECTS.has(g.c1)||SUBJECTS.has(g.c2));
  const seen={};
  for(const g of scope){ const lists = useAll?[g.p1,g.p2]:[SUBJECTS.has(g.c1)?g.p1:[],SUBJECTS.has(g.c2)?g.p2:[]]; for(const L of lists)for(const s of L)seen[s]=(seen[s]||0)+1; }
  ctl3.appendChild(el(`<span class="muted">屬性：</span>`));
  const elG=el(`<div class="cg"></div>`);
  [['','全部'],['dark','暗'],['light','光'],['fire','火'],['ice','水'],['earth','木']].forEach(([v,lbl])=>{
    const b=el(`<button class="${FILTER_EL===v?'active':''}"${v?` style="color:${ELC[v]}"`:''}>${lbl}</button>`);
    b.onclick=()=>{FILTER_EL=v;CHAR=null;render();}; elG.appendChild(b);});
  ctl3.appendChild(elG);
  let opts=Object.keys(seen).sort((a,b)=>seen[b]-seen[a]);
  if(FILTER_EL) opts=opts.filter(s=>EL[s]===FILTER_EL);
  if((CHAR==null||!opts.includes(CHAR))&&opts.length)CHAR=opts[0];
  const sel=el(`<select>${opts.map(s=>`<option value="${s}"${s===CHAR?' selected':''} style="color:${elColor(s)};background:#0D1424">${esc(nm(s))}（${seen[s]}）</option>`).join('')}</select>`);
  if(CHAR) sel.style.color=elColor(CHAR);
  sel.onchange=e=>{CHAR=e.target.value;render();};
  ctl3.appendChild(el(`<span class="muted" style="margin-left:8px">角色：</span>`)); ctl3.appendChild(sel);
  app.appendChild(ctl3);

  if(!POOL.length){ app.appendChild(el(`<div class="note">還沒有資料。請先到 <a href="./rta-dashboard.html" style="color:#93C5FD">RTA 對戰分析</a> 匯入 JSON，再回來這頁（共用同一份本機資料）。</div>`)); return; }
  if(!CHAR){ app.appendChild(el(`<div class="empty">此範圍沒有可分析的角色</div>`)); return; }

  const R=analyze(CHAR);
  const X=nm(CHAR), mine=PERSP==='mine';
  const wins=R.aGames.filter(g=>g.won).length, base=pct(wins,R.aGames.length);
  const subLbl = useAll?'全部數據':[...SUBJECTS].map(c=>names[c]||('#'+c)).join('＋');
  const rkLbl = RANKFILTER?`｜對手排名 ≤${RANKFILTER}`:'';
  app.appendChild(el(`<div class="hdr"><span class="big">${cn(CHAR)}</span><span class="muted">${mine?'我方選':'敵方選'} · ${esc(subLbl)}${rkLbl} · ${mine?'上場':'對到'} ${R.aGames.length} 場</span></div>`));
  app.appendChild(el(`<div class="tiles">
    <div class="tile"><div class="v b">${base}%</div><div class="k">${mine?`${X} 上場勝率`:`對上 ${X} 我方勝率`}（${wins}–${R.aGames.length-wins}）</div></div>
    <div class="tile"><div class="v">${pct(R.banned,R.total)}%</div><div class="k">被 draft-ban（${R.banned}/${R.total}）</div></div>
    <div class="tile"><div class="v">${pct(R.prebanned,R.total)}%</div><div class="k">被 pre-ban（${R.prebanned}/${R.total}）</div></div>
  </div>`));
  app.appendChild(el(`<div class="note">${mine
    ? `你選了 <b>${X}</b>：左表＝<b>要帶／打得贏</b>，右表＝<b>別帶／打不贏</b>（可改選或 ban 掉對面那張）。`
    : `對面選了 <b>${X}</b>：左表＝<b>拿去打 ${X} 勝率高（該帶）</b>，右表＝<b>勝率低（別帶）</b>。`
    } 門檻 單一≥8/雙人≥6/三人≥6；建議用「全部數據」樣本較足。</div>`));

  if(mine){
    app.appendChild(twoTables(`我方隊友搭配`,`和 ${X} 同隊的隊友`,agg(R.aGames,'myField',1),6,base,
      `▲ 適合和 ${X} 一起帶（同隊勝率高）`,`▼ 儘量別和 ${X} 一起帶（同隊勝率低）`));
    app.appendChild(twoTables(`對面單一角色`,`對面有此角時、帶 ${X} 的勝率`,agg(R.aGames,'foeField',1),8,base,
      `▲ 帶 ${X} 打得贏（對面有這些時勝率高）`,`▼ 帶 ${X} 打不贏（勝率低→改選或 ban 掉對面這張）`));
    app.appendChild(twoTables(`對面雙人組合`,`對面同時有這兩張時`,agg(R.aGames,'foeField',2),6,base,
      `▲ 帶 ${X} 打得贏（這雙人在對面時勝率高）`,`▼ 帶 ${X} 打不贏（這雙人在對面時勝率低）`));
    app.appendChild(twoTables(`對面三人組合`,`對面同時有這三張時（樣本稀疏）`,agg(R.aGames,'foeField',3),6,base,
      `▲ 帶 ${X} 打得贏`,`▼ 帶 ${X} 打不贏`));
  } else {
    app.appendChild(twoTables(`我方對抗 ${X}（單卡）`,`對面有 ${X} 時、我帶此角的勝率`,agg(R.aGames,'myField',1),8,base,
      `▲ 拿這張打 ${X} 勝率高（該帶）`,`▼ 拿這張打 ${X} 勝率低（別帶）`));
    app.appendChild(twoTables(`我方對抗 ${X}（雙人組）`,`對面有 ${X} 時、我帶這兩張`,agg(R.aGames,'myField',2),6,base,
      `▲ 這雙人打 ${X} 勝率高（該一起上）`,`▼ 這雙人打 ${X} 勝率低（別靠這組）`));
    app.appendChild(twoTables(`${X} 的隊友（對面）`,`對面 ${X} 常搭這些時、我方勝率`,agg(R.aGames,'foeField',1),6,base,
      `▲ ${X} 搭這些時我反而好打`,`▼ ${X} 搭這些時最難打（要小心）`));
  }
  app.appendChild(overallTable());
}
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
  if(e.key==='q'||e.key==='Q'){ PERSP=PERSP==='mine'?'enemy':'mine'; render(); }
});
render();
</script>
</body></html>
